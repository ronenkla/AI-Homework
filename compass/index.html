<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <title>מצפן</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0d1b2a;
      --dial: #1b2b3e;
      --line: #3a506b;
      --text: #e9f1f7;
      --muted: #8fa3b8;
      --north: #ff4d4d;
      --accent: #5bc0eb;
      --ok: #4cd18a;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      user-select: none;
      -webkit-user-select: none;
    }

    h1 { margin: 4px 0 0; font-size: 1.3rem; color: var(--muted); font-weight: 600; }

    .reading { text-align: center; margin: 14px 0 6px; }
    .deg { font-size: 4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; direction: ltr; }
    .dir { font-size: 1.6rem; color: var(--accent); margin-top: 4px; min-height: 1.2em; }

    .compass {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 1;
      margin: 16px 0;
    }
    /* Fixed marker at the top: the direction the phone points to */
    .compass::before {
      content: "";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      border: 12px solid transparent;
      border-top: 18px solid var(--accent);
      z-index: 2;
    }
    #dial {
      width: 100%;
      height: 100%;
      transition: transform 0.15s linear;
    }

    .status { color: var(--muted); text-align: center; max-width: 340px; min-height: 2.5em; margin: 0; }

    button {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #062033;
      cursor: pointer;
    }
    #start { margin-top: 10px; }

    .location { margin-top: 14px; text-align: center; color: var(--muted); font-size: 0.95rem; direction: ltr; }

    /* Broadcast to computer */
    .link {
      margin-top: 18px;
      width: min(88vw, 420px);
      border-top: 1px solid var(--line);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      text-align: center;
    }
    .link-title { color: var(--muted); font-size: 0.95rem; }
    .link-row { display: flex; gap: 8px; width: 100%; }
    .link-row input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      text-align: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--dial);
      color: var(--text);
      direction: ltr;
    }
    .link-row button { padding: 10px 18px; font-size: 1rem; }
    .live { color: var(--ok); font-weight: 600; }
    .live::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ok);
      margin-inline-end: 6px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <h1>🧭 מצפן</h1>

  <div class="reading">
    <div class="deg" id="deg">--°</div>
    <div class="dir" id="dir"></div>
  </div>

  <div class="compass">
    <svg id="dial" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
  </div>

  <p class="status" id="status">לחצו על "הפעלת מצפן" והחזיקו את הטלפון שטוח</p>
  <button id="start">הפעלת מצפן</button>
  <div class="location" id="location"></div>

  <section class="link">
    <div class="link-title">שידור למחשב: הקלידו את הקוד שמופיע במחשב, או סרקו את קוד ה־QR</div>
    <div class="link-row">
      <input id="code" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="off">
      <button id="connect">חיבור</button>
    </div>
    <div id="linkStatus"></div>
  </section>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="shared.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const setHeading = createDial($("dial"));

    let gotReading = false;
    let started = false;

    // Last sensor reading, sent to the computer when linked
    const reading = { h: 0, b: 0, g: 0 };

    function showHeading(heading, beta, gamma) {
      gotReading = true;
      const { degrees, name } = setHeading(heading);
      $("deg").textContent = degrees + "°";
      $("dir").textContent = name;
      reading.h = degrees;
      reading.b = Math.round(beta ?? 0);
      reading.g = Math.round(gamma ?? 0);
      send();
    }

    const screenAngle = () => (screen.orientation && screen.orientation.angle) || window.orientation || 0;

    // Android (Chrome, Samsung Internet): alpha is measured from true north
    function onAbsolute(e) {
      if (e.alpha === null) return;
      showHeading(360 - e.alpha + screenAngle(), e.beta, e.gamma);
    }

    // iPhone (Safari): gives the compass heading directly
    function onIOS(e) {
      if (e.webkitCompassHeading !== undefined) showHeading(e.webkitCompassHeading + screenAngle(), e.beta, e.gamma);
    }

    async function start() {
      if (started) return;
      started = true;
      $("start").hidden = true;
      $("status").textContent = "מחפש חיישן מצפן...";

      if ("ondeviceorientationabsolute" in window) {
        // Android: no permission needed
        window.addEventListener("deviceorientationabsolute", onAbsolute);
      } else {
        // iPhone asks for permission first
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          try {
            if (await DeviceOrientationEvent.requestPermission() !== "granted") {
              $("status").textContent = "לא ניתנה הרשאה לחיישנים. רעננו את הדף ואשרו את הבקשה.";
              $("start").hidden = false;
              started = false;
              return;
            }
          } catch {}
        }
        window.addEventListener("deviceorientation", onIOS);
      }

      // Keep the screen on while using the compass
      try { await navigator.wakeLock?.request("screen"); } catch {}

      setTimeout(() => {
        $("status").textContent = gotReading
          ? "אם הכיוון לא מדויק, הזיזו את הטלפון בתנועת ∞ באוויר כדי לכייל את המצפן"
          : "לא נמצא חיישן מצפן. פתחו את הדף בטלפון (לא במחשב).";
      }, 2500);

      showLocation();
    }

    // Bonus: show GPS coordinates under the compass (stays on the phone, not sent)
    function showLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          $("location").textContent =
            `${latitude.toFixed(5)}, ${longitude.toFixed(5)}  (±${Math.round(accuracy)} m)`;
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    // ---- Broadcast to the computer ----
    let client = null;
    let topic = null;
    let lastSent = 0;

    function send() {
      if (!client || !client.connected) return;
      const now = Date.now();
      if (now - lastSent < 66) return; // about 15 updates a second
      lastSent = now;
      client.publish(topic, JSON.stringify(reading));
    }

    function link(code) {
      code = code.replace(/\D/g, "");
      if (code.length !== 6) {
        $("linkStatus").textContent = "הקוד צריך להיות 6 ספרות";
        return;
      }
      if (client) client.end(true);
      topic = topicFor(code);
      $("linkStatus").textContent = "מתחבר...";
      client = connectMqtt();
      client.on("connect", () => {
        $("linkStatus").innerHTML = `<span class="live">משדר למחשב · קוד ${code}</span>`;
        client.publish(topic, JSON.stringify({ ...reading, hello: true }));
      });
      client.on("offline", () => { $("linkStatus").textContent = "אין חיבור לאינטרנט, מנסה שוב..."; });
      client.on("error", () => { $("linkStatus").textContent = "החיבור נכשל, מנסה שוב..."; });
      start();
    }

    $("start").addEventListener("click", start);
    $("connect").addEventListener("click", () => link($("code").value));

    // Opened from the QR code on the computer: ?pair=123456
    const pair = new URLSearchParams(location.search).get("pair");
    if (pair) {
      $("code").value = pair;
      $("status").textContent = "לחצו על \"הפעלת מצפן\" כדי להתחיל לשדר למחשב";
      $("start").addEventListener("click", () => link(pair), { once: true });
    }
  </script>
</body>
</html>
