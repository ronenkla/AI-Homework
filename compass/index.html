<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <title>מצפן</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0d1b2a;
      --dial: #1b2b3e;
      --line: #3a506b;
      --text: #e9f1f7;
      --muted: #8fa3b8;
      --north: #ff4d4d;
      --accent: #5bc0eb;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      user-select: none;
      -webkit-user-select: none;
    }

    h1 { margin: 4px 0 0; font-size: 1.3rem; color: var(--muted); font-weight: 600; }

    .reading { text-align: center; margin: 14px 0 6px; }
    .deg { font-size: 4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; direction: ltr; }
    .dir { font-size: 1.6rem; color: var(--accent); margin-top: 4px; min-height: 1.2em; }

    .compass {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 1;
      margin: 16px 0;
    }
    /* Fixed marker at the top: the direction the phone points to */
    .compass::before {
      content: "";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      border: 12px solid transparent;
      border-top: 18px solid var(--accent);
      z-index: 2;
    }
    #dial {
      width: 100%;
      height: 100%;
      transition: transform 0.15s linear;
    }

    .status { color: var(--muted); text-align: center; max-width: 340px; min-height: 2.5em; margin: 0; }

    button {
      margin-top: 10px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #062033;
      cursor: pointer;
    }

    .location { margin-top: 14px; text-align: center; color: var(--muted); font-size: 0.95rem; direction: ltr; }
  </style>
</head>
<body>
  <h1>🧭 מצפן</h1>

  <div class="reading">
    <div class="deg" id="deg">--°</div>
    <div class="dir" id="dir"></div>
  </div>

  <div class="compass">
    <svg id="dial" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
  </div>

  <p class="status" id="status">לחצו על "הפעלת מצפן" והחזיקו את הטלפון שטוח</p>
  <button id="start">הפעלת מצפן</button>
  <div class="location" id="location"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    const DIRECTIONS = ["צפון", "צפון־מזרח", "מזרח", "דרום־מזרח", "דרום", "דרום־מערב", "מערב", "צפון־מערב"];
    const CARDINALS = { 0: "צ", 90: "מז", 180: "ד", 270: "מע" };

    // Draw the dial: a tick every 5°, longer every 30°, letters at N/E/S/W
    function drawDial() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = $("dial");
      const add = (tag, attrs, text) => {
        const el = document.createElementNS(ns, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        if (text) el.textContent = text;
        svg.appendChild(el);
        return el;
      };
      const css = getComputedStyle(document.documentElement);
      const color = (name) => css.getPropertyValue(name).trim();

      add("circle", { r: 98, fill: color("--dial"), stroke: color("--line"), "stroke-width": 2 });

      for (let a = 0; a < 360; a += 5) {
        const major = a % 30 === 0;
        const rad = (a - 90) * Math.PI / 180;
        const r1 = 94, r2 = major ? 82 : 88;
        add("line", {
          x1: r1 * Math.cos(rad), y1: r1 * Math.sin(rad),
          x2: r2 * Math.cos(rad), y2: r2 * Math.sin(rad),
          stroke: a === 0 ? color("--north") : major ? color("--text") : color("--muted"),
          "stroke-width": major ? 2 : 1,
        });
        const label = CARDINALS[a] ?? (major ? String(a) : null);
        if (label) {
          const big = a in CARDINALS;
          const rl = big ? 66 : 72;
          add("text", {
            x: rl * Math.cos(rad), y: rl * Math.sin(rad),
            fill: a === 0 ? color("--north") : big ? color("--text") : color("--muted"),
            "font-size": big ? 15 : 8,
            "font-weight": big ? 700 : 400,
            "text-anchor": "middle",
            "dominant-baseline": "central",
            transform: `rotate(${a} ${rl * Math.cos(rad)} ${rl * Math.sin(rad)})`,
          }, label);
        }
      }

      // Needle: red half points north, white half south
      add("polygon", { points: "0,-50 7,0 -7,0", fill: color("--north") });
      add("polygon", { points: "0,50 7,0 -7,0", fill: color("--text") });
      add("circle", { r: 4, fill: color("--bg") });
    }

    // Rotate the dial so north on the dial matches real north.
    // Keeps a running angle so the dial never spins the long way around 0°/360°.
    let rotation = 0;
    let last = null;
    let gotReading = false;

    function showHeading(heading) {
      heading = (heading % 360 + 360) % 360;
      gotReading = true;

      if (last === null) rotation = heading;
      else rotation += ((heading - last + 540) % 360) - 180;
      last = heading;

      $("dial").style.transform = `rotate(${-rotation}deg)`;
      $("deg").textContent = Math.round(heading) % 360 + "°";
      $("dir").textContent = DIRECTIONS[Math.round(heading / 45) % 8];
    }

    const screenAngle = () => (screen.orientation && screen.orientation.angle) || window.orientation || 0;

    // Android (Chrome, Samsung Internet): alpha is measured from true north
    function onAbsolute(e) {
      if (e.alpha === null) return;
      showHeading(360 - e.alpha + screenAngle());
    }

    // iPhone (Safari): gives the compass heading directly
    function onIOS(e) {
      if (e.webkitCompassHeading !== undefined) showHeading(e.webkitCompassHeading + screenAngle());
    }

    async function start() {
      $("start").hidden = true;
      $("status").textContent = "מחפש חיישן מצפן...";

      if ("ondeviceorientationabsolute" in window) {
        // Android: no permission needed
        window.addEventListener("deviceorientationabsolute", onAbsolute);
      } else {
        // iPhone asks for permission first
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          try {
            if (await DeviceOrientationEvent.requestPermission() !== "granted") {
              $("status").textContent = "לא ניתנה הרשאה לחיישנים. רעננו את הדף ואשרו את הבקשה.";
              $("start").hidden = false;
              return;
            }
          } catch {}
        }
        window.addEventListener("deviceorientation", onIOS);
      }

      // Keep the screen on while using the compass
      try { await navigator.wakeLock?.request("screen"); } catch {}

      setTimeout(() => {
        $("status").textContent = gotReading
          ? "אם הכיוון לא מדויק, הזיזו את הטלפון בתנועת ∞ באוויר כדי לכייל את המצפן"
          : "לא נמצא חיישן מצפן. פתחו את הדף בטלפון (לא במחשב).";
      }, 2500);

      showLocation();
    }

    // Bonus: show GPS coordinates under the compass
    function showLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          $("location").textContent =
            `${latitude.toFixed(5)}, ${longitude.toFixed(5)}  (±${Math.round(accuracy)} m)`;
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    drawDial();
    $("start").addEventListener("click", start);
  </script>
</body>
</html>
