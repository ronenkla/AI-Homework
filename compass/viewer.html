<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מצפן — צפייה במחשב</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0d1b2a;
      --panel: #142335;
      --dial: #1b2b3e;
      --line: #3a506b;
      --text: #e9f1f7;
      --muted: #8fa3b8;
      --north: #ff4d4d;
      --accent: #5bc0eb;
      --ok: #4cd18a;
      --warn: #f5b84c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }

    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.8rem; }
    .sub { margin: 4px 0 0; color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
    }

    /* Pairing */
    .pair { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .pair h2 { margin: 0; font-size: 1.1rem; }
    .pair ol { margin: 0; padding-inline-start: 20px; text-align: right; color: var(--muted); line-height: 1.7; }
    #qr { background: #fff; padding: 10px; border-radius: 12px; line-height: 0; }
    .code { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.25em; direction: ltr; font-variant-numeric: tabular-nums; }
    .conn { font-weight: 600; }
    .conn.wait { color: var(--warn); }
    .conn.ok { color: var(--ok); }
    .conn.off { color: var(--north); }

    /* Live view */
    .live { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
    .reading { grid-column: 1 / -1; text-align: center; }
    .deg { font-size: 4.5rem; font-weight: 700; line-height: 1; direction: ltr; font-variant-numeric: tabular-nums; }
    .dir { font-size: 1.7rem; color: var(--accent); margin-top: 6px; min-height: 1.2em; }

    .compass { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto; }
    .compass::before {
      content: "";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      border: 12px solid transparent;
      border-top: 18px solid var(--accent);
      z-index: 2;
    }
    #dial { width: 100%; height: 100%; transition: transform 0.12s linear; }

    /* 3D phone that copies the real phone's tilt */
    .tilt { text-align: center; }
    .stage { perspective: 700px; height: 300px; display: grid; place-items: center; }
    .phone {
      width: 130px;
      height: 260px;
      border-radius: 22px;
      background: linear-gradient(160deg, #2c3e57, #1a2738);
      border: 4px solid #4b6280;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s linear;
      display: grid;
      place-items: center;
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0d1b2a;
    }
    .phone-arrow { font-size: 3rem; color: var(--accent); }
    .angles { display: flex; justify-content: center; gap: 24px; color: var(--muted); margin-top: 8px; }
    .angles b { display: block; color: var(--text); font-size: 1.3rem; direction: ltr; }

    .waiting { opacity: 0.35; }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .live { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🧭 המצפן של הטלפון — על המחשב</h1>
    <p class="sub">הטלפון שולח את הכיוון וההטיה שלו בזמן אמת, והמחשב מציג אותם</p>
  </header>

  <main class="layout">
    <section class="panel pair">
      <h2>חיבור הטלפון</h2>
      <div id="qr"></div>
      <div>או הקלידו בטלפון את הקוד:</div>
      <div class="code" id="code"></div>
      <ol>
        <li>סרקו את הקוד במצלמה של הטלפון</li>
        <li>בטלפון, לחצו "הפעלת מצפן"</li>
        <li>הזיזו את הטלפון וצפו כאן</li>
      </ol>
      <div class="conn wait" id="conn">ממתין לטלפון...</div>
    </section>

    <section class="panel live waiting" id="live">
      <div class="reading">
        <div class="deg" id="deg">--°</div>
        <div class="dir" id="dir"></div>
      </div>
      <div class="compass">
        <svg id="dial" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
      </div>
      <div class="tilt">
        <div class="stage">
          <div class="phone" id="phone"><span class="phone-arrow">↑</span></div>
        </div>
        <div class="angles">
          <div>קדימה / אחורה<b id="beta">0°</b></div>
          <div>ימינה / שמאלה<b id="gamma">0°</b></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="shared.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const setHeading = createDial($("dial"));

    // Pairing code: 6 digits, kept across refreshes so the phone stays linked
    let code = null;
    try { code = localStorage.getItem("compassCode"); } catch {}
    if (!/^\d{6}$/.test(code || "")) {
      code = String(Math.floor(100000 + Math.random() * 900000));
      try { localStorage.setItem("compassCode", code); } catch {}
    }
    $("code").textContent = code;

    // QR code that opens the phone compass already paired with this computer
    const phoneUrl = new URL(`./?pair=${code}`, location.href).href;
    new QRCode($("qr"), { text: phoneUrl, width: 200, height: 200, colorDark: "#0d1b2a", colorLight: "#ffffff" });

    function setConn(text, kind) {
      $("conn").textContent = text;
      $("conn").className = "conn " + kind;
    }

    let lastMessage = 0;

    function show(data) {
      lastMessage = Date.now();
      $("live").classList.remove("waiting");
      setConn("✓ הטלפון מחובר", "ok");

      const { degrees, name } = setHeading(data.h);
      $("deg").textContent = degrees + "°";
      $("dir").textContent = name;

      $("beta").textContent = data.b + "°";
      $("gamma").textContent = data.g + "°";
      $("phone").style.transform = `rotateX(${-data.b}deg) rotateY(${data.g}deg)`;
    }

    const client = connectMqtt();
    client.on("connect", () => {
      client.subscribe(topicFor(code));
      if (!lastMessage) setConn("ממתין לטלפון...", "wait");
    });
    client.on("message", (_topic, payload) => {
      try { show(JSON.parse(payload.toString())); } catch {}
    });
    client.on("offline", () => setConn("אין חיבור לאינטרנט, מנסה שוב...", "off"));

    // No updates for a few seconds: the phone was closed or lost connection
    setInterval(() => {
      if (lastMessage && Date.now() - lastMessage > 4000) {
        setConn("הטלפון הפסיק לשדר", "off");
        $("live").classList.add("waiting");
      }
    }, 1000);
  </script>
</body>
</html>
