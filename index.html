<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שיעורי בית — AI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #11161f;
      color: #e8edf5;
      padding: 16px;
    }
    main { max-width: 520px; width: 100%; }
    h1 { margin: 0 0 6px; }
    p { color: #94a0b4; margin: 0 0 20px; }
    a.card {
      display: block;
      margin-bottom: 12px;
      padding: 18px 20px;
      border-radius: 14px;
      background: #1b2230;
      border: 1px solid #2b3546;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { border-color: #ff7a45; }
    a.card b { display: block; font-size: 1.2rem; margin-bottom: 4px; }
    a.card span { color: #94a0b4; }
  </style>
</head>
<body>
  <main>
    <h1>שיעורי בית — AI</h1>
    <p>אתרים סטטיים שנבנו בעזרת AI</p>
    <a class="card" href="earthquakes/">
      <b>🌍 רעידות אדמה בעולם</b>
      <span>מפה חיה של רעידות אדמה מה־USGS Earthquake API</span>
    </a>
    <a class="card" href="compass/">
      <b>🧭 מצפן</b>
      <span>מצפן שעובד בטלפון בעזרת חיישני המכשיר</span>
    </a>
  </main>
</body>
</html>
